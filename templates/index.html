<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
    <title>Expense Tracker</title>
</head>

<body>
    <div class="container">
        <h1> Expense Tracker</h1>

        <div class="dashboard">

            <div class="card">
                <h3>Total Spent</h3>
                <p>€{{ total }}</p>
            </div>

            <div class="card">
                <h3>Transactions</h3>
                <p>{{ count }}</p>
            </div>

            <div class="card">
                <h3>Biggest Expense</h3>
                <p>€{{ max_expense }}</p>
            </div>

            <div class="card">
                <h3>Top Category</h3>
                <p>{{ top_category }}</p>
            </div>

        </div>

        <form action="/add" method="POST">
            <input name="title" placeholder="Expense title" required>
            <input name="amount" type="number" step="0.01" placeholder="Amount" required>
            <select name="category_id" required>
                <option value="">Select category</option>

                {% for c in categories %}
                <option value="{{ c[0] }}">
                    {{ c[1] }}
                </option>
                {% endfor %}
            </select>
            <input name="date" type="date" required>
            <button type="submit">Add Expense</button>
        </form>

        <!-- FILTER -->
        <form method="GET">
            <input type="month" name="month" value="{{ month }}">
            <button type="submit">Filter</button>
            <a href="/">Reset</a>
        </form>

        <h2>Expenses</h2>

        <table>

            <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Save</th>
                <th>Delete</th>
            </tr>

            {% for e in expenses %}
            <tr id="row--{{ e[0] }}">
                <td><input value="{{ e[1] }}" id="title-{{ e[0] }}"></td>
                <td><input value="{{ e[2] }}" id="amount-{{ e[0] }}"></td>
                <td>
                    <select id="category-{{ e[0] }}">

                        {% for c in categories %}
                        <option value="{{ c[1] }}" {% if c[1]==e[3] %}selected{% endif %}>
                            {{ c[1] }}
                        </option>
                        {% endfor %}

                    </select>
                </td>

                <!-- DATE INPUT correto -->
                <td>
                    <input type="date" value="{{ e[4] }}" id="date-{{ e[0] }}">
                </td>

                <td>
                    <button type="button" class="save-expense" data-expense-id="{{ e[0] }}" aria-label="Save expense">
                        💾
                    </button>
                </td>

                <td>
                    <a href="/delete/{{ e[0] }}">❌</a>
                </td>
            </tr>
            {% endfor %}

        </table>

    </div>
</body>

</html>
